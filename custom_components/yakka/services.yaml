complete_chore:
  target: &chore_target
    entity:
      integration: yakka
  fields:
    chore:
      example: "Take out the bins"
      selector:
        text:
    member:
      example: "Alex"
      selector:
        text:
    note:
      selector:
        text:
          multiline: true
    completed_at:
      selector:
        datetime:
    config_entry_id:
      selector:
        config_entry:
          integration: yakka

undo_completion:
  target: *chore_target
  fields:
    chore:
      example: "Take out the bins"
      selector:
        text:
    completion_id:
      selector:
        text:
    config_entry_id:
      selector:
        config_entry:
          integration: yakka
